services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Platform sets this; Vite >= 6.1 appends it to allowedHosts so the preview origin is accepted.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  node_modules:
